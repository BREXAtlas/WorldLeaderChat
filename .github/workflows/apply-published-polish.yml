name: Apply verified published newsroom polish

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - ".github/published-polish-trigger/**"

permissions:
  contents: write

concurrency:
  group: apply-published-polish-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'ops/apply-published-polish')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Replace legacy stock chats and merge repeated coverage
        run: node scripts/cleanup-published-duplicates.mjs

      - name: Test, validate and build the exact result
        run: |
          npm test
          npm run validate
          npm run build

      - name: Commit cleaned canonical data to the pull-request branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "world-leader-chat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published-events.json data/site-meta.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Published newsroom data is already polished."
            exit 0
          fi
          git commit -m "Apply article-specific published chat polish"
          git push origin "HEAD:${HEAD_BRANCH}"

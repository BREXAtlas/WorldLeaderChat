name: News ingestion

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "How far back to scan each feed"
        required: false
        default: "72"
      minimum_score:
        description: "Minimum World Leader Chat relevance score"
        required: false
        default: "7"
      max_candidates:
        description: "Maximum new editorial issues in this run"
        required: false
        default: "12"

permissions:
  contents: read
  issues: write
  copilot-requests: write

concurrency:
  group: world-leader-chat-news-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INGESTION_OUTPUT: tmp/ingestion-candidates.json
      WLC_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '72' }}
      WLC_MINIMUM_SCORE: ${{ inputs.minimum_score || '7' }}
      WLC_MAX_CANDIDATES: ${{ inputs.max_candidates || '12' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Fetch, normalize, rank and diversify current news
        run: node scripts/ingest-news.mjs

      - name: Open deduplicated editorial issues
        id: queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/open-editorial-issues.mjs

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Draft truth-first short articles and back-and-forth chats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_DRAFT_LIMIT: 20
        run: node scripts/draft-editorial-issues.mjs

      - name: Write run summary
        run: |
          {
            echo "## World Leader Chat news sweep"
            echo
            echo "- Schedule: every six hours"
            echo "- New editorial issues: ${{ steps.queue.outputs.issues_created }}"
            echo "- Existing candidates skipped: ${{ steps.queue.outputs.issues_skipped }}"
            echo "- Coverage: world affairs, politics, technology, science, space, business, culture, entertainment, society and sports"
            echo "- New candidates receive a sourced short article and a 10–14-message conversation before owner approval."
            echo "- Nothing publishes without owner approval."
          } >> "$GITHUB_STEP_SUMMARY"

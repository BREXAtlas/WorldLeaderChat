name: News ingestion

on:
  schedule:
    # Intake runs before each newsroom review window. It only opens deduplicated
    # files; the durable editorial worker owns all article and chat generation.
    - cron: "20 7,11,15,19 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "How far back to scan each feed"
        required: false
        default: "168"
      minimum_score:
        description: "Minimum World Leader Chat relevance score"
        required: false
        default: "4"
      max_candidates:
        description: "Maximum new editorial issues in this run"
        required: false
        default: "8"

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: world-leader-chat-news-intake
  cancel-in-progress: false
  queue: max

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INGESTION_OUTPUT: tmp/ingestion-candidates.json
      WLC_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '168' }}
      WLC_MINIMUM_SCORE: ${{ inputs.minimum_score || '4' }}
      WLC_MAX_CANDIDATES: ${{ inputs.max_candidates || '8' }}
      WLC_MINIMUM_PER_DESK: "1"
      WLC_MINIMUM_PUBLISHERS: "8"
      WLC_MINIMUM_PUBLISHERS_PER_DESK: "2"
      WLC_MAXIMUM_PER_PUBLISHER: "4"
      WLC_MINIMUM_PUBLISHERS_PER_ORIENTATION: "4"
      WLC_MAXIMUM_ORIENTATION_DIFFERENCE: "1"
      WLC_DAILY_CANDIDATE_LIMIT: "20"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Fetch, normalize, rank and balance all eight desks
        run: node scripts/ingest-news.mjs

      - name: Open deduplicated editorial issues
        id: queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/open-editorial-issues.mjs

      - name: Hand the queue to the durable editorial worker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run draft-editorial-queue-now.yml --repo "${GITHUB_REPOSITORY}" --ref main -f today_only=true

      - name: Write run summary
        run: |
          {
            echo "## World Leader Chat news intake"
            echo
            echo "- Review windows: 8 AM, noon, 4 PM and 8 PM America/Chicago"
            echo "- Intake opens at most eight deduplicated files and then exits; it never holds the writing queue"
            echo "- Publisher guard: at least two publishers per desk and eight across the daily slate when feed coverage permits"
            echo "- Viewpoint-source guard: equal monitored left/right pools with no more than a one-publisher slate difference when usable coverage permits"
            echo "- New editorial issues: ${{ steps.queue.outputs.issues_created }}"
            echo "- Existing candidates skipped: ${{ steps.queue.outputs.issues_skipped }}"
            echo "- Daily article ceiling: 20; candidates beyond the ceiling: ${{ steps.queue.outputs.issues_daily_limit }}"
            echo "- Drafting runs separately in one durable queue with up to four files written in parallel"
            echo "- Nothing publishes without owner approval."
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/report-ingestion-summary.mjs

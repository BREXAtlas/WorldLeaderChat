name: News ingestion

on:
  schedule:
    # Start forty minutes before each newsroom review window so drafted current-day
    # recommendations are waiting at 8 AM, noon, 4 PM and 8 PM Chicago time.
    - cron: "20 7,11,15,19 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "How far back to scan each feed"
        required: false
        default: "168"
      minimum_score:
        description: "Minimum World Leader Chat relevance score"
        required: false
        default: "4"
      max_candidates:
        description: "Maximum new editorial issues in this run"
        required: false
        default: "24"

permissions:
  contents: read
  issues: write
  copilot-requests: write

concurrency:
  group: world-leader-chat-editorial-production
  cancel-in-progress: false
  queue: max

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INGESTION_OUTPUT: tmp/ingestion-candidates.json
      WLC_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '168' }}
      WLC_MINIMUM_SCORE: ${{ inputs.minimum_score || '4' }}
      WLC_MAX_CANDIDATES: ${{ inputs.max_candidates || '24' }}
      WLC_MINIMUM_PER_DESK: "2"
      WLC_MINIMUM_PUBLISHERS: "8"
      WLC_MINIMUM_PUBLISHERS_PER_DESK: "2"
      WLC_MAXIMUM_PER_PUBLISHER: "4"
      WLC_MINIMUM_PUBLISHERS_PER_ORIENTATION: "4"
      WLC_MAXIMUM_ORIENTATION_DIFFERENCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Fetch, normalize, rank and balance all eight desks
        run: node scripts/ingest-news.mjs

      - name: Open deduplicated editorial issues
        id: queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/open-editorial-issues.mjs

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Draft truth-first short articles and back-and-forth chats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_DRAFT_LIMIT: 30
        run: node scripts/draft-editorial-issues.mjs

      - name: Enforce direct first-person dialogue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_REFINE_LIMIT: 60
        run: node scripts/refine-editorial-dialogue.mjs

      - name: Write run summary
        run: |
          {
            echo "## World Leader Chat news sweep"
            echo
            echo "- Review windows: 8 AM, noon, 4 PM and 8 PM America/Chicago"
            echo "- Sweep begins forty minutes before each window so drafting can finish before review"
            echo "- Lookback: seven days, so quieter desks are not crowded out by the latest conflict cycle"
            echo "- Required first pass: two recommendations each for War & Security, World News, Politics & Society, Technology & AI, Science & Space, Business & Power, Culture & Entertainment, Sports & Soft Power"
            echo "- Publisher guard: use at least two publishers per desk and eight across the daily slate whenever current feed coverage permits"
            echo "- Viewpoint-source guard: the monitored partisan pool is equal left/right, and each slate targets at least four distinct publishers per side with no more than a one-publisher difference when usable coverage permits"
            echo "- New editorial issues: ${{ steps.queue.outputs.issues_created }}"
            echo "- Existing candidates skipped: ${{ steps.queue.outputs.issues_skipped }}"
            echo "- New candidates receive a sourced short article and a 10–14-message direct conversation before owner approval."
            echo "- Nothing publishes without owner approval."
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/report-ingestion-summary.mjs

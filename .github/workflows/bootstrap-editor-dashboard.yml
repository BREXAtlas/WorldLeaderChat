name: Install verified editor dashboard source

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - ".github/bootstrap/editor-dashboard/**"

permissions:
  contents: write

concurrency:
  group: install-editor-dashboard-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  install:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/install-editor-dashboard')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and verify application archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/bootstrap/editor-dashboard/chunk-*.b64 | base64 --decode > /tmp/editor-dashboard.tar.gz
          echo "46a607969b7868f8850abbc738a81db1fb00bab1c81c28dc6a351094a1898f29  /tmp/editor-dashboard.tar.gz" | sha256sum --check --strict
          if tar -tzf /tmp/editor-dashboard.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path detected." >&2
            exit 1
          fi

      - name: Install dashboard, drafting engine, and permanent workflows
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/editor-dashboard.tar.gz -C .
          rm -rf .github/bootstrap/editor-dashboard
          rm -f .github/workflows/bootstrap-editor-dashboard.yml

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test, validate, and build
        run: |
          npm test
          npm run validate
          npm run build

      - name: Commit the finished source to the pull-request branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "world-leader-chat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Install editorial dashboard and Copilot drafting engine"
          git push origin "HEAD:${HEAD_BRANCH}"

name: Bootstrap editor dashboard branch

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/editor-dashboard/manifest.json"
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: bootstrap-editor-dashboard
  cancel-in-progress: false

jobs:
  install:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message != 'Install editorial dashboard application files') ||
      (github.event_name == 'issues' && github.event.label.name == 'bootstrap-editor-dashboard')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify application archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/bootstrap/editor-dashboard/chunk-*.b64 | base64 --decode > /tmp/editor-dashboard.tar.gz
          echo "fa94979ba13062f0ec62e6cca35be1fafe18528f7214ec931c4b07b72e1cd8cd  /tmp/editor-dashboard.tar.gz" | sha256sum --check --strict
          if tar -tzf /tmp/editor-dashboard.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path detected." >&2
            exit 1
          fi

      - name: Install dashboard and drafting source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/editor-dashboard.tar.gz -C .
          rm -rf .github/bootstrap/editor-dashboard

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test, validate, and build
        run: |
          npm test
          npm run validate
          npm run build

      - name: Commit installed application files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "world-leader-chat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Install editorial dashboard application files"
          git push origin HEAD:main

      - name: Close bootstrap issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --comment "Editor dashboard source installed, tested, validated, and built on main."

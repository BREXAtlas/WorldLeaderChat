name: Validate repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check newsroom and editor JavaScript syntax
        run: |
          node --check social-tools.js
          node --check newsroom-site.js
          node --check disclosure-polish.js
          node --check recency-order.js
          node --check rolling-archive.js
          node --check editor/app.js
          node --check editor/conversation-upgrade.js
          node --check editor/newsroom-upgrade.js
          node --check scripts/draft-editorial-issues.mjs
          node --check scripts/draft-editorial-issues-v2.mjs
          node --check scripts/refine-editorial-dialogue.mjs
          node --check scripts/rewrite-chat-only.mjs
          node --check scripts/cleanup-published-duplicates.mjs
          node --check scripts/lib/chat-quality.mjs
          node --check scripts/lib/newsroom-dialogue.mjs
          node --check scripts/lib/article-dialogue.mjs
          node --check scripts/lib/published-dedupe.mjs
          node --check scripts/lib/validation.mjs
          node --check scripts/ingest-news.mjs

      - name: Run unit tests
        run: npm test

      - name: Validate repository data and safeguards
        run: npm run validate

      - name: Build the static site artifact
        run: npm run build

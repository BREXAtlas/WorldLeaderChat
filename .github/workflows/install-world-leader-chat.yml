name: Install World Leader Chat repository

on:
  push:
    branches: [main]
    paths:
      - ".github/bootstrap/**"
      - ".github/workflows/install-world-leader-chat.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/installer-trigger/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-world-leader-chat
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/bootstrap/part-*.b64 | base64 --decode > /tmp/world-leader-chat.tar.gz
          echo "5fdfaf0d4e56caed375f0f1d624e8579e273e2a6dfcd65ad710cd917b8cef009  /tmp/world-leader-chat.tar.gz" | sha256sum --check --strict
          if tar -tzf /tmp/world-leader-chat.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path detected."
            exit 1
          fi

      - name: Install repository source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/world-leader-chat.tar.gz -C .
          rm -rf .github/bootstrap

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test, validate, and build
        run: |
          npm test
          npm run validate
          npm run build

      - name: Commit completed repository
        shell: bash
        run: |
          set -euo pipefail

          # Validation needs the permanent workflow files present. The connector
          # publishes them after this build, so remove only those four files
          # immediately before the GITHUB_TOKEN commit.
          rm -f \
            .github/workflows/ci.yml \
            .github/workflows/deploy-pages.yml \
            .github/workflows/editorial-publish.yml \
            .github/workflows/news-ingestion.yml

          git config user.name "world-leader-chat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build World Leader Chat application and editorial service"
          git push origin HEAD:main

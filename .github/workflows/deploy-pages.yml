name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "social-tools.js"
      - "social-card-export.js"
      - "newsroom-taxonomy.js"
      - "source-audit.js"
      - "newsroom-experience.js"
      - "newsroom-site.js"
      - "disclosure-polish.js"
      - "recency-order.js"
      - "rolling-archive.js"
      - "newsroom-contract.js"
      - "custom-submission.js"
      - "editor/**"
      - "data/published-events.json"
      - "data/site-meta.json"
      - "config/news-sources.json"
      - "scripts/build-site.mjs"
      - "scripts/validate-repository.mjs"
      - "scripts/lib/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed newsroom, social carousels, sponsors, editor, archives and copy tools
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          PUBLIC_URL: https://worldleaders.chat/
        run: |
          set -euo pipefail
          test -n "${PAGE_URL}"
          PAGE_URL="${PUBLIC_URL}"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "social-card-export.js?v=20260811-social-export-fix"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F 'rel="canonical" href="https://worldleaders.chat/"'
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/CNAME" | grep -Fx "worldleaders.chat"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "brand-fallback"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "recency-order.js?v=20260810"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "rolling-archive.js?v=20260811-newsroom-experience"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "newsroom-site.js?v=20260811-source-audit"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "newsroom-contract.js?v=20260811"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "source-audit.js?v=20260811-balanced-sources"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "newsroom-experience.js?v=20260811-newsroom-experience"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/source-audit.js" | grep -F "HOW THE PERCENTAGES WORK"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/source-audit.js" | grep -F "MONITORED PARTISAN POOL"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/data/source-pool.json" | grep -F '"right": 5'
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/data/source-pool.json" | grep -F '"publisher": "National Review"'
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/newsroom-experience.js" | grep -F "CHECK OUT THESE RELATED ARTICLES"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/newsroom-experience.js" | grep -F "TICKER_LIMIT = 12"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/social-card-export.js" | grep -F "Save Social PNG"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/social-card-export.js" | grep -F "WLC_SOCIAL_EXPORT"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/social-card-export.js" | grep -F "Story / TikTok (9:16)"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/social-card-export.js" | grep -F "Save Social Carousel"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/social-card-export.js" | grep -F "Share Social Carousel"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/social-card-export.js" | grep -F 'PAGE ${pageNumber} / ${pageCount}'
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/social-card-export.js" | grep -F 'const SOCIAL_IMAGE_URL = "worldleaders.chat"'
          ! curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/social-card-export.js" | grep -F "#event="
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "if(isDialogBackdropClick(e)) closeEvent();"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "FROM OUR SPONSORS"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "https://ednotebook.com"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "https://outbreak-atlas-cyclospora.magazinebeaucoup.chatgpt.site/"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/recency-order.js" | grep -F "compareRecency"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/rolling-archive.js" | grep -F "LATEST"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/rolling-archive.js" | grep -F 'class="day-archive"'
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/rolling-archive.js" | grep -F "MINIMUM_VISIBLE_FILES = 10"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/rolling-archive.js" | grep -F "MONTH ARCHIVE"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/newsroom-contract.js" | grep -F "recentNewsroomDays: 8"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/newsroom-contract.js" | grep -F "minimumParagraphs: 3"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/social-tools.js" | grep -F "Copy Article + Chat"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/" | grep -F "app.js?v=writer-recovery-20260812"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/" | grep -F "DRAFT RECOVERY"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/" | grep -F "Finish Today’s Drafts"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/" | grep -F "Generate a custom article from links"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/" | grep -F "custom-submission.js?v=20260811"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/custom-submission.js" | grep -F "WLC_CUSTOM_SUBMISSION"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/app.js" | grep -F "COMPLETE SHORT REPORT"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/app.js" | grep -F "Rewrite Chat"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/app.js" | grep -F "No owner writing is needed"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/app.js" | grep -F "Candidate rejected and saved in Trash"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/app.js" | grep -F "recycled fill-in-the-headline template"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/app.js" | grep -F 'Feature in ${esc(cardDesk)} Carousel'
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/app.js" | grep -F "activeLane = 'publishing'"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "hello@transformontologysystems.com"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "Powered by TOS"
          ! curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/data/published-events.json" | grep -F '"issueUrl"'
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/conversation-upgrade.js" | grep -F "browserGeneratedDialogue: false"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/newsroom-upgrade.js" | grep -F "never manufactures or rewrites dialogue"
          echo "Verified social PNG and carousel exports, sponsors, eight-day newsroom, day archives, editor and copy tools: ${PAGE_URL}"

  report:
    if: always()
    needs: [build, deploy, verify]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish Pages deployment status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_RESULT}" == "success" && "${DEPLOY_RESULT}" == "success" && "${VERIFY_RESULT}" == "success" ]]; then
            state="success"
            description="Social carousels, sponsors and newsroom deployed"
          else
            state="failure"
            description="build=${BUILD_RESULT} deploy=${DEPLOY_RESULT} verify=${VERIFY_RESULT}"
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="pages/live-smoke" \
            -f description="${description}" \
            -f target_url="${RUN_URL}"

          [[ "${state}" == "success" ]]

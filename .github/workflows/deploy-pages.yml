name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "social-tools.js"
      - "newsroom-site.js"
      - "disclosure-polish.js"
      - "rolling-archive.js"
      - "editor/**"
      - "data/published-events.json"
      - "data/site-meta.json"
      - "scripts/build-site.mjs"
      - "scripts/validate-repository.mjs"
      - "scripts/lib/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed monthly newsroom, archives, sharing tools, and editor
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "${PAGE_URL}"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL}" | grep -F "rolling-archive.js"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/newsroom-site.js" | grep -F "CURRENT FILES"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/rolling-archive.js" | grep -F "CURRENT MONTH"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/rolling-archive.js" | grep -F "MINIMUM_VISIBLE_FILES = 10"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/rolling-archive.js" | grep -F "MONTH ARCHIVE"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/disclosure-polish.js" | grep -F "POLITICAL PARODY, NOT LEAKED CORRESPONDENCE"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/social-tools.js" | grep -F "Copy Article + Chat"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/" | grep -F "newsroom-upgrade.js"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/app.js" | grep -F "Rewrite Chat"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/conversation-upgrade.js" | grep -F "browserGeneratedDialogue: false"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "${PAGE_URL%/}/editor/newsroom-upgrade.js" | grep -F "never manufactures or rewrites dialogue"
          echo "Verified live current-month newsroom, unique-chat editor, archives and sharing tools: ${PAGE_URL}"

  report:
    if: always()
    needs: [build, deploy, verify]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish Pages deployment status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_RESULT}" == "success" && "${DEPLOY_RESULT}" == "success" && "${VERIFY_RESULT}" == "success" ]]; then
            state="success"
            description="Current-month newsroom, unique chats and editor deployed"
          else
            state="failure"
            description="build=${BUILD_RESULT} deploy=${DEPLOY_RESULT} verify=${VERIFY_RESULT}"
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="pages/live-smoke" \
            -f description="${description}" \
            -f target_url="${RUN_URL}"

          [[ "${state}" == "success" ]]

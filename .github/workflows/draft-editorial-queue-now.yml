name: Draft current editorial queue

on:
  workflow_dispatch:
    inputs:
      today_only:
        description: "Finish only today's newsroom files"
        required: false
        default: true
        type: boolean
      target_issue:
        description: "Optional single issue number for a focused recovery"
        required: false
        default: ""
        type: string
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - ".github/editorial-draft-trigger/**"

permissions:
  contents: read
  issues: write

concurrency:
  group: world-leader-chat-editorial-production
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        (github.event.label.name == 'draft-batch-requested' || github.event.label.name == 'redraft-requested')
      ) ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'agent/run-editorial-draft')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      WLC_REQUEST_TARGET: ${{ github.event_name == 'issues' && github.event.label.name == 'redraft-requested' && github.event.issue.number || inputs.target_issue || '' }}
      WLC_REQUEST_TODAY_ONLY: ${{ github.event_name == 'issues' && github.event.label.name == 'draft-batch-requested' && '1' || (inputs.today_only && '1' || '0') }}

    steps:
      - name: Check out the published drafting engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore the no-credit local newsroom writer
        id: writer-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.tool_cache }}/world-leader-chat-writer
          key: wlc-local-writer-qwen25-7b-b10375-v1-${{ runner.os }}

      - name: Start the no-credit local newsroom writer
        run: bash scripts/start-local-newsroom-writer.sh

      - name: Refresh the selected custom article source
        if: env.WLC_REQUEST_TARGET != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_TARGET_ISSUE: ${{ env.WLC_REQUEST_TARGET }}
        run: node scripts/enrich-custom-submission.mjs

      - name: Create complete truth-first editorial suggestions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_DRAFT_BATCH_SIZE: "10"
          WLC_DAILY_DRAFT_LIMIT: "30"
          WLC_TODAY_ONLY: ${{ env.WLC_REQUEST_TARGET != '' && '0' || env.WLC_REQUEST_TODAY_ONLY }}
          WLC_TARGET_ISSUE: ${{ env.WLC_REQUEST_TARGET }}
          WLC_MAX_ATTEMPTS: ${{ env.WLC_REQUEST_TARGET != '' && '3' || '2' }}
        run: node scripts/run-drafting-batches.mjs

      - name: Replace meta narration with direct recurring-speaker dialogue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_REFINE_LIMIT: 50
        run: node scripts/refine-editorial-dialogue.mjs

      - name: Confirm the selected file or report the later-batch backlog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_TODAY_ONLY: ${{ env.WLC_REQUEST_TARGET != '' && '0' || env.WLC_REQUEST_TODAY_ONLY }}
          WLC_TARGET_ISSUE: ${{ env.WLC_REQUEST_TARGET }}
          WLC_ALLOW_BACKLOG: ${{ env.WLC_REQUEST_TARGET != '' && '0' || '1' }}
        run: node scripts/assert-editorial-readiness.mjs

      - name: Clear the editor issue trigger
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
        run: gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --remove-label "${TRIGGER_LABEL}" || true

      - name: Save the verified local newsroom writer
        if: always() && steps.writer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.tool_cache }}/world-leader-chat-writer
          key: wlc-local-writer-qwen25-7b-b10375-v1-${{ runner.os }}

name: Draft current editorial queue

on:
  workflow_dispatch:
    inputs:
      today_only:
        description: "Finish only today's newsroom files"
        required: false
        default: true
        type: boolean
      target_issue:
        description: "Optional single issue number for a focused recovery"
        required: false
        default: ""
        type: string
      target_action:
        description: "For a focused recovery, regenerate the article and chat or only the chat"
        required: false
        default: "article"
        type: choice
        options:
          - article
          - chat
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

# User requests are durable labels on the issues. queue: max prevents GitHub from
# discarding older waiting runs, and every run coalesces all outstanding labels.
concurrency:
  group: world-leader-chat-editorial-production
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        (
          github.event.label.name == 'draft-batch-requested' ||
          github.event.label.name == 'redraft-requested' ||
          github.event.label.name == 'regenerate-requested'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
      count: ${{ steps.queue.outputs.count }}
      remaining: ${{ steps.queue.outputs.remaining }}

    steps:
      - name: Check out the production newsroom worker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build one durable work list from all outstanding editor requests
        id: queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_FORCE_BATCH: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'draft-batch-requested' && '1' || '0' }}
          WLC_TODAY_ONLY: ${{ github.event_name == 'issues' && github.event.label.name == 'draft-batch-requested' && '1' || (inputs.today_only && '1' || '0') }}
          WLC_TARGET_ISSUE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_issue || '' }}
          WLC_TARGET_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.target_action || 'article' }}
          WLC_WORKER_LIMIT: "20"
        run: node scripts/prepare-editorial-worker.mjs

  write:
    name: "${{ matrix.action == 'chat' && 'Rewrite chat' || 'Draft article and chat' }} #${{ matrix.issue }}"
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the production newsroom worker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore the no-credit local newsroom writer
        id: writer-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.tool_cache }}/world-leader-chat-writer
          key: wlc-local-writer-qwen25-7b-b10375-v1-${{ runner.os }}

      - name: Start the no-credit local newsroom writer
        run: bash scripts/start-local-newsroom-writer.sh

      - name: Refresh owner-submitted source material
        if: matrix.action == 'article'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_TARGET_ISSUE: ${{ matrix.issue }}
        run: node scripts/enrich-custom-submission.mjs

      - name: Generate a source-locked article and original chat
        if: matrix.action == 'article'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_TARGET_ISSUE: ${{ matrix.issue }}
          WLC_FORCE_REWRITE: "1"
          WLC_DRAFT_LIMIT: "1"
          WLC_MAX_ATTEMPTS: "3"
        run: node scripts/draft-editorial-issues.mjs

      - name: Rewrite only the original article-specific chat
        if: matrix.action == 'chat'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_TARGET_ISSUE: ${{ matrix.issue }}
        run: node scripts/rewrite-chat-only.mjs

      - name: Prove this file reached Ready for Approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_TARGET_ISSUE: ${{ matrix.issue }}
        run: node scripts/assert-editorial-readiness.mjs

      - name: Recover only this interrupted file
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_TARGET_ISSUE: ${{ matrix.issue }}
        run: node scripts/recover-interrupted-drafts.mjs

      - name: Save the verified local newsroom writer
        if: always() && steps.writer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.tool_cache }}/world-leader-chat-writer
          key: wlc-local-writer-qwen25-7b-b10375-v1-${{ runner.os }}

  finish:
    needs: [prepare, write]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the production newsroom worker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Clear completed Finish Today batch markers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/clear-editorial-batch-triggers.mjs

      - name: Report the real production result
        env:
          SELECTED: ${{ needs.prepare.outputs.count }}
          REMAINING: ${{ needs.prepare.outputs.remaining }}
          WRITE_RESULT: ${{ needs.write.result }}
        run: |
          {
            echo "## Editorial worker"
            echo
            echo "- Selected files: ${SELECTED}"
            echo "- Files retained for the next worker: ${REMAINING}"
            echo "- Writing result: ${WRITE_RESULT}"
            echo "- A file counts as completed only after it reaches Ready for Approval."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail visibly when any selected file did not become ready
        if: needs.write.result == 'failure' || needs.write.result == 'cancelled'
        run: |
          echo "One or more selected files failed the article/chat quality gate. The affected file is labeled Needs Editor and the workflow is intentionally red." >&2
          exit 1

name: Draft current editorial queue

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - ".github/editorial-draft-trigger/**"

permissions:
  contents: read
  issues: write
  copilot-requests: write

concurrency:
  group: world-leader-chat-editorial-drafting
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'agent/run-editorial-draft')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the published drafting engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Create complete S-M-A-R editorial suggestions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_DRAFT_LIMIT: 20
        run: node scripts/draft-editorial-issues.mjs

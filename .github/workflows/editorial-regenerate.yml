name: Regenerate editorial chat

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  copilot-requests: write

concurrency:
  group: world-leader-chat-editorial-production
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.event.label.name == 'regenerate-requested'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the production chat engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Generate a completely new article-specific chat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_TARGET_ISSUE: ${{ github.event.issue.number }}
        run: node scripts/rewrite-chat-only.mjs

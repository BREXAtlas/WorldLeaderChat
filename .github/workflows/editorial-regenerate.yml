name: Regenerate editorial chat

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: world-leader-chat-editorial-production
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.event.label.name == 'regenerate-requested'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the production chat engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore the no-credit local newsroom writer
        id: writer-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.tool_cache }}/world-leader-chat-writer
          key: wlc-local-writer-qwen25-7b-b10375-v1-${{ runner.os }}

      - name: Start the no-credit local newsroom writer
        run: bash scripts/start-local-newsroom-writer.sh

      - name: Generate a completely new article-specific chat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WLC_TARGET_ISSUE: ${{ github.event.issue.number }}
        run: node scripts/rewrite-chat-only.mjs

      - name: Save the verified local newsroom writer
        if: always() && steps.writer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.tool_cache }}/world-leader-chat-writer
          key: wlc-local-writer-qwen25-7b-b10375-v1-${{ runner.os }}
